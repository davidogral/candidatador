name: Release

on:
  push:
    tags: ["v*"]
  # Disparo manual: monta o pacote e confere os artefatos sem publicar nada.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  verify-dist:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - name: Instala o wheel num ambiente limpo e roda a CLI
        run: |
          ls -l dist/
          uv venv /tmp/check
          uv pip install --python /tmp/check dist/*.whl
          /tmp/check/bin/candidatador version
          /tmp/check/bin/python -c "import candidatador.web as w; assert (w.STATIC / 'index.html').exists()"

  github-release:
    needs: verify-dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # Publica no PyPI via Trusted Publishing (configure o projeto no PyPI antes:
  # https://docs.pypi.org/trusted-publishers/). Sem token/segredo no repositório.
  pypi:
    needs: verify-dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
