[project]
name = "candidatador"
version = "0.1.0"
description = "Candidatador: seu assistente open source de candidaturas. Organize currículos e certificados, encontre vagas em vários sites e candidate-se automaticamente (com a sua revisão)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Candidatador contributors" }]
keywords = ["jobs", "vagas", "job-search", "auto-apply", "resume", "curriculo", "playwright", "gupy", "linkedin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Portuguese (Brazilian)",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "pydantic>=2.7",
  "sqlmodel>=0.0.21",
  "pyyaml>=6.0",
  "platformdirs>=4.2",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Pontuação de vagas e respostas de formulário com IA (Claude)
ai = ["anthropic>=0.70"]
# Preenchimento e envio automático de candidaturas via navegador
apply = ["playwright>=1.45"]
# LinkedIn, Indeed, Glassdoor, Google Jobs e ZipRecruiter via python-jobspy
jobspy = ["python-jobspy>=1.1.80"]
all = ["candidatador[ai,apply,jobspy]"]

[project.scripts]
candidatador = "candidatador.cli:app"

[project.urls]
Homepage = "https://github.com/davidogral/candidatador"
Documentation = "https://github.com/davidogral/candidatador/tree/main/docs"
Issues = "https://github.com/davidogral/candidatador/issues"
Changelog = "https://github.com/davidogral/candidatador/blob/main/CHANGELOG.md"

# Plugins de terceiros podem registrar novas fontes/aplicadores sem alterar este repositório:
#
# [project.entry-points."candidatador.sources"]
# minha_fonte = "meu_pacote.fonte:MinhaFonte"
#
# [project.entry-points."candidatador.appliers"]
# meu_aplicador = "meu_pacote.aplicador:MeuAplicador"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml>=6.0",
  "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candidatador"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # Typer usa chamadas em defaults de argumentos

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src/candidatador"]
ignore_missing_imports = true
warn_unused_ignores = true
